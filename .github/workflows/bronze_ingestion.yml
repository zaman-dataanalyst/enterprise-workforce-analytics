name: Workforce Bronze Ingestion  # Display name in the GitHub Actions dashboard

on:
  workflow_dispatch: # Allows manual triggering of the pipeline
  schedule:
    - cron: '0 0 * * *' # Automatic daily run at midnight (UTC)

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Professional Dependencies
        run: |
          pip install pandas requests faker google-cloud-storage google-cloud-bigquery db-dtypes tqdm

      - name: Authenticate to Google Cloud
        # Converts the GCP_KEY_JSON secret into a temporary physical file
        run: echo '${{ secrets.GCP_KEY_JSON }}' > gcp-key.json

      - name: Run Bronze Ingestion Pipeline
        env:
          # Injecting GitHub Secrets into the environment for Python access
          OXR_APP_ID: ${{ secrets.OXR_APP_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: gcp-key.json
        run: |
          # Ensure the path and filename matches your repository structure
          python python_etl/ingest_workforce_bronze.py

      - name: Cleanup Security Keys
        # Deletes the key file after execution for security compliance
        if: always()
        run: rm -f gcp-key.json
