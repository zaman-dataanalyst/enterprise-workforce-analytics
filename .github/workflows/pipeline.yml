name: Enterprise Workforce Analytics Pipeline

on:
  workflow_dispatch: # Manual button ke liye
  schedule:
    - cron: '0 0 * * *' # Rozana raat 12 baje automatic run

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Professional Dependencies
        run: |
          pip install pandas requests faker google-cloud-storage google-cloud-bigquery db-dtypes tqdm

      - name: Authenticate to Google Cloud
        # Ye step aapke secret JSON ko ek temporary file mein badal dega
        run: echo '${{ secrets.GCP_KEY_JSON }}' > gcp-key.json

      - name: Run Enterprise ETL Pipeline
        env:
          # Yahan hum GitHub ki tijori se secrets nikaal kar Python ko de rahe hain
          OXR_APP_ID: ${{ secrets.OXR_APP_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: gcp-key.json
        run: |
          # Tasalli kar lein ke path 'python_etl/data_pipeline.py' hi hai
          python python_etl/data_pipeline.py

      - name: Cleanup Security Keys
        # Kaam khatam hone ke baad key delete karna achi practice hai
        if: always()
        run: rm -f gcp-key.json
