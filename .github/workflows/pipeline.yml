name: Enterprise Workforce Analytics Pipeline

on:
  schedule:
    - cron: '0 2 * * *' # Daily scheduled run at 02:00 UTC
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install \
            google-cloud-bigquery \
            google-cloud-storage \
            pandas \
            pandas-gbq \
            requests \
            faker \
            tqdm \
            python-dateutil \
            db-dtypes

      # Create GCP key file from GitHub secret
      - name: Authenticate GCP Service Account
        run: echo '${{ secrets.GCP_KEY_JSON }}' > gcp-key.json

      # Set credentials path for GCP auth
      - name: Set Google Application Credentials
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-key.json" >> $GITHUB_ENV
        
      # Run ETL script with API key
      - name: Run Data Ingestion
        env:
          OXR_APP_ID: ${{ secrets.OXR_APP_ID }}
        run: python python_etl/data_pipeline.py
