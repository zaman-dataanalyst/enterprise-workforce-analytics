# =============================================================================

name: 'workforce_analytics'
version: '1.0.0'
config-version: 2
profile: 'workforce_analytics'

# Directory Paths & Structure
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# =============================================================================
# MODEL HIERARCHY & DATA GOVERNANCE
# =============================================================================
models:
  workforce_analytics:
    # PROJECT DEFAULT: Defaulting to views to minimize storage costs for transient nodes.
    +materialized: view

    # SILVER LAYER: Centralized cleaning and standardization plant.
    # RATIONALE: Persisted as 'table' to optimize compute for 3.7M rows and 
    # handle 22+ complex string transformations (UPPER/TRIM) once.
    staging:
      +materialized: table
      +schema: silver_layer  # Exactly matches BigQuery dataset
      +tags: ["hris", "enterprise_staging"]

    # GOLD LAYER: Production-ready Star Schema for BI consumption.
    # RATIONALE: Tables ensure low-latency joins and sub-second response times 
    # for Power BI reporting (DirectQuery/Import).
    marts:
      +materialized: table
      +schema: gold_layer    # Exactly matches BigQuery dataset
      +tags: ["hris_reporting", "analytics_marts"]